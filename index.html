<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgive Me</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f9ecec, #ffe6f0);
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      color: #e74c3c;
      text-shadow: 1px 1px 2px #fff;
    }

    p {
      font-size: 1.5em;
      margin: 20px;
      max-width: 80%;
      transition: opacity 0.5s ease;
    }

    button {
      margin: 10px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #yes {
      background-color: #2ecc71;
      color: white;
    }

    #no {
      background-color: #e74c3c;
      color: white;
    }

    button:hover {
      transform: scale(1.1);
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: floatUp 5s infinite ease-in;
    }

    .heart::before, .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        bottom: -20px;
        opacity: 1;
      }
      100% {
        bottom: 100%;
        transform: translateX(-50px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Can i have 100% already??</h1>
  <p id="message">I'm really sorry... I am dying to see you now please make it 100%. You cannot escape unless you say yes🤭🤭  </p>
  <div>
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <script>
    const messages = [
      "Abb tumko bhot pyaar krenge😘",
      "Kabhi tumko akela nhi chor kr jayenge🤞",
      "I really miss you a lot😔",
      "Please Sweetheart 🥺",
      "Aaj mai 100% lekr hi maanunga🤗",
      "Maan jao pleaseeeeeeeeeeeeeeeeee🥺",
      "Abb kabhi tumko kam important nhi feel hone denge😘😘😘😘"
    ];

    const messageEl = document.getElementById("message");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    // Heart animation
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.bottom = "0px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 600);

    // On "No" click
    noBtn.addEventListener("click", () => {
      const newMsg = messages[Math.floor(Math.random() * messages.length)];
      messageEl.textContent = newMsg;

      // Animate shake
      messageEl.classList.add("shake");
      setTimeout(() => messageEl.classList.remove("shake"), 500);
    });

    // On "Yes" click
    yesBtn.addEventListener("click", () => {
      messageEl.textContent = "Thank you! I’ll never let you down again ❤️";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";
    });
  </script>

</body>
</html>
